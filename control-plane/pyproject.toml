[project]
name = "agentforge-control-plane"
version = "0.1.0"
description = "FrameMind 控制平面:基于 OpenHands SDK 的 Intent-First AI Agent 任务编排与执行服务"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    # --- OpenHands 底座(MIT) ---
    "openhands-sdk>=1.0.0",
    "openhands-tools>=1.0.0",
    "openhands-workspace>=1.0.0",
    "openhands-agent-server>=1.0.0",
    # --- 模型抽象(MIT) ---
    "litellm>=1.52.0",
    # --- 多 Agent 编排(MIT) ---
    "langgraph>=0.2.60",
    # 注意:langgraph-checkpoint-postgres 的官方实现硬依赖 psycopg(LGPLv3 许可证),
    # 与本项目"依赖许可证仅限 MIT/Apache-2.0"的硬性约束冲突。
    # 默认不启用 Postgres checkpointer(app/orchestrator/checkpointer.py 会优雅降级为
    # 不持久化状态),如需启用见该文件顶部注释里的两个合规选项。
    # "langgraph-checkpoint-postgres>=2.0.0",
    # "psycopg[binary]>=3.2.0",
    # --- Web / API(MIT) ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # --- 数据库(MIT) ---
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    # --- 队列(MIT) ---
    "arq>=0.26.1",
    "redis>=5.1.1",
    # --- 认证(MIT/BSD) ---
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=43.0.0",
    # --- Docker 沙箱编排(Apache-2.0) ---
    "docker>=7.1.0",
    # --- 工具 ---
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI 的 Depends(...) 作为默认参数是官方推荐写法,不是真实问题。
# RUF012: arq WorkerSettings / 类似配置类的可变类属性是其官方用法要求的写法。
ignore = ["B008", "RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
